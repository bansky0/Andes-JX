
name: Build macOS (test)

on:
  push:
    branches:
      - main
      - feature/macos-build
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure universal build
        run: >-
          cmake -S . -B build/macos -G Xcode
          -DCMAKE_BUILD_TYPE=Release
          '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Compile
        run: cmake --build build/macos --config Release --parallel 3

      - name: Collect and inspect plugins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          while IFS= read -r -d '' plugin; do
            cp -R "$plugin" dist/
          done < <(
            find build/macos -type d \
              \( -name 'AndesJX.vst3' -o -name 'AndesJX.component' \) \
              -print0
          )

          test -d dist/AndesJX.vst3
          test -d dist/AndesJX.component

          for plugin in dist/AndesJX.vst3 dist/AndesJX.component; do
            binary=$(find "$plugin/Contents/MacOS" -type f | head -n 1)

            echo "Checking: $binary"

            lipo -archs "$binary" | tee /tmp/andes-archs.txt

            grep -qw arm64 /tmp/andes-archs.txt
            grep -qw x86_64 /tmp/andes-archs.txt
          done

      - name: Upload unsigned test bundles
        uses: actions/upload-artifact@v4
        with:
          name: Andes-JX-macOS-universal-unsigned
          path: dist/
          if-no-files-found: error
